[package]
name = "kiln"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Components for inline terminal apps on ratatui: scrollback-native viewport, composer, streaming markdown, pickers and themes"
license = "Apache-2.0"
repository = "https://github.com/Zfinix/kiln"
readme = "README.md"
keywords = ["tui", "cli", "ratatui", "terminal", "components"]
categories = ["command-line-interface"]
exclude = ["assets/*.tape"]

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = { version = "0.30", features = ["scrolling-regions", "unstable-widget-ref", "unstable-rendered-line-info"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "chat"
path = "examples/chat/main.rs"
